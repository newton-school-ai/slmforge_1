name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

jobs:
  guard:
    name: Hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASCII-only check
        run: |
          if grep -rPn '[^\x00-\x7F]' --include="*.md" --include="*.py" --include="*.sh" --include="*.yml" --include="*.yaml" --include="*.toml" . | grep -v '.git/' | grep -v 'MILESTONES_1_2_REPORT.md'; then
            echo "Non-ASCII characters found"
            exit 1
          fi

      - name: Internal-data path guard
        run: |
          if find . -type f -path '*/_internal/*' ! -name 'PROJECT_CONTEXT.md' | grep -q .; then
            echo "Forbidden file under _internal/"
            exit 1
          fi

      - name: Internal-data regex scan
        run: |
          echo 'Scanning for NST internal identifiers...'
          PATTERNS='_internal/|nst_data/|internal\.nst\.'
          if git grep -E "$PATTERNS" -- '*.py' '*.yaml' '*.yml' '*.json' '*.md' | \
            grep -vE '^(\.github/workflows/ci\.yml|.*/\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|src/slmforge/data/source_guard\.py|tests/unit/test_source_guard\.py|README\.md|CONTRIBUTING\.md|GITHUB_ISSUES\.md|ISSUES_TRACKER\.md|MILESTONES\.md|POD_GUIDE\.md|docs/):' | \
            grep -v '_internal/PROJECT_CONTEXT\.md'; then
            echo '::error::Internal data pattern detected!'
            exit 1
          fi
          echo 'Clean - no internal data patterns found.'

  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Unit & Integration tests
        run: pytest tests/unit tests/integration -q
